# Gravel tire price tracker watchlist
# ----------------------------------
# Gravel tires only, grouped by size. The daily GitHub Action
# (scripts/tire_prices.py) checks each tire's current price at
# Worldwide Cyclery and writes data/tire_prices.json + data/tire_history.json.
#
# Tire picks are what's winning big gravel races in 2026 and topping
# the major tire tests (Velo, BikeRadar, Cyclingnews, road.cc), limited
# to tires with a US Shopify store price: Worldwide Cyclery, and inCycle
# (SoCal) for Specialized tires. Buy links go to Amazon whenever possible.
#
# Fields
#   id        unique slug, used by the {{< tire-price "id" >}} shortcode
#   brand / name / size   display text
#   category  must match a key under `categories` below
#   slot      chart color 1-5, unique within its category
#   note      optional one-line "why it's here" (keep it factual + sourced)
#   amazon    Amazon link with your tag (shown as a button, never with a price)
#   store     price source (Shopify store)
#     base     store root URL, no trailing slash
#     handle   the part after /products/ in the URL (WWC uses one page per size)
#
# Amazon prices are never shown — Amazon only allows prices pulled from
# their API. The store price is the public reference; the Amazon button
# is where readers check theirs.

categories:
  - key: "29x2-2"
    title: '2.2–2.25"'
    size_note: '29 × 2.2–2.25" · about 56–57mm'
    home: true
    blurb: "MTB XC tires on a gravel bike. The biggest volume and most comfort, if your frame clears them. More and more pros run this size at rough events."
  - key: "29x2-1"
    title: '2.1"'
    size_note: '29 × 2.1" · about 53mm'
    home: false
    blurb: "Slightly narrower XC tires. Fast-rolling, and they fit more frames than 2.2s."
  - key: "55mm"
    title: "55mm"
    size_note: "700 × 55"
    home: false
    blurb: "Gravel-specific tires at near-MTB volume. Winning setups at a muddy Unbound 2026 leaned 50–55mm."
  - key: "50mm"
    title: "50mm"
    size_note: "700 × 50"
    home: true
    blurb: "Where pro gravel racing has largely settled. A fast, grippy middle ground if your frame has the clearance."
  - key: "45mm"
    title: "45–47mm"
    size_note: "700 × 45–47"
    home: true
    blurb: "The all-rounder size most gravel bikes ship with. Still raced at the top level: the women's Unbound XL 2026 win was on 45s."
  - key: "40mm"
    title: "40–42mm"
    size_note: "700 × 40–42"
    home: false
    blurb: "Faster on pavement and the max for many older gravel frames. Best for mixed rides with more road than dirt."

