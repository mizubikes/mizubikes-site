# Tire price tracker watchlist
# ----------------------------
# One entry per tire, one size each. The daily GitHub Action
# (scripts/tire_prices.py) checks each tire's current price at
# Worldwide Cyclery and writes data/tire_prices.json + data/tire_history.json.
#
# Fields
#   id        unique slug, used by the {{< tire-price "id" >}} shortcode
#   brand     display brand
#   name      display model name
#   size      size + casing shown under the name
#   category  must match a key under `categories` below
#   slot      chart color 1-4, unique within its category
#   amazon    Amazon link with your tag (shown as a button, never with a price)
#   store     price source (Shopify store)
#     base     store root URL, no trailing slash
#     handle   the part after /products/ in the URL (WWC uses one page per size)
#     match / exclude   optional words to pick a variant if a page has several
#
# Amazon prices are never shown — Amazon only allows prices pulled from
# their API. The store price is the public reference; the Amazon button
# is where readers check theirs.

categories:
  - key: road
    title: "Road"
    size_note: "700 × 30, tubeless"
    blurb: "Fast, supple race tires. 30mm is where most road riders have landed for speed and comfort."
  - key: gravel
    title: "Gravel"
    size_note: "700 × 45, tubeless"
    blurb: "45mm all-rounders, from fast-rolling file treads to tires with real cornering knobs."
  - key: trail
    title: "Trail MTB"
    size_note: "29 × 2.4–2.6, tubeless"
    blurb: "The trail and enduro standards. Prices are per tire, with the casing listed since it changes both weight and price."

