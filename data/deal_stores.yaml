# Bike deal finder — store list
# -----------------------------
# The daily GitHub Action (scripts/deal_finder.py) scans every enabled store
# below and writes data/deals.json + data/deal_history.json, which the
# /bike-deals/ page renders.
#
# Every store here must be a Shopify shop: the script reads the public
# <base>/products.json catalog. To test whether a store works, open
# <base>/products.json in a browser — if you see JSON, it will scan.
#
# Fields
#   id          unique slug
#   name        display name on the page
#   base        store root URL, no trailing slash
#   enabled     false to skip without deleting the entry
#   collections optional list of collection handles to scan instead of the
#               whole catalog (the part after /collections/ in the URL,
#               e.g. ["sale", "clearance"]). Much faster on big stores.
#   used        true if the store sells mostly used gear. The whole store is
#               skipped: this page lists new gear only. Used, demo and
#               pre-owned items at other stores are filtered out by title.
#   max_pages   optional override of settings.max_pages (250 products/page)
#   affiliate   optional link template once the store approves you.
#               {url} = product URL, {url_encoded} = URL-encoded product URL.
#               AvantLink example:
#               "https://www.avantlink.com/click.php?tt=cl&merchant_id=MERCHANT&website_id=WEBSITE&url={url_encoded}"
#               Leave empty for a plain (non-affiliate) link.

settings:
  # "Best today" (the page's default view): a short row of top deals from each
  # of these categories, in this order. Keys: bikes, framesets, wheels,
  # drivetrain, brakes, suspension, cockpit, tires, electronics, apparel,
  # tools, accessories.
  front_sections: [bikes, wheels, drivetrain, electronics, tires]
  front_per_section: 5        # 5 on desktop; tablets and phones show the first 4
  min_discount: 0.20          # the normal bar: 20% under the store's list price
  # ...but not every deal has to be 20% off:
  rare_min_discount: 0.10     # gear that rarely goes on sale counts from 10% off:
  rare_sale_rate: 0.05        #   brands that discount under 5% of their products (measured each scan
  rare_sale_min_products: 25  #   across all stores, over at least 25 products), plus this list:
  rare_sale_brands: [ENVE, Chris King, Industry Nine, Silca, Factor, Wolf Tooth, Garbaruk, Zipp, Roval, Ohlins, Cane Creek, Reserve]
  big_save_min_discount: 0.12 # and any deal 12%+ off that saves at least big_save_min dollars
  big_save_min: 400

  # Popularity. An item matches an entry when its brand + title contain every
  # word of the entry, in any order ("SRAM E1" matches "SRAM Force E1 ...").
  # A word ending in * matches any word starting with it ("R92*" = R9200, R9270).
  # popular_terms: current generation people are shopping for. Ranked higher,
  # and they count as deals from rare_min_discount.
  popular_terms:
    - Transmission            # SRAM Eagle Transmission (T-Type)
    - T-Type
    - SRAM E1
    - Eagle 90
    - Eagle 70
    - XX SL
    - SRAM Red AXS
    - XPLR AXS
    - Shimano R92*            # Dura-Ace 12-speed (R9200, R9250, R9270 ...)
    - Shimano R81*            # Ultegra 12-speed
    - Shimano R71*            # 105 12-speed
    - Shimano M92*            # XTR, latest
    - Shimano M82*            # XT, latest
    - Shimano RX82*           # GRX 12-speed
    - Shimano RX61*
    - Epic 9
    - Stumpjumper 15
    - Tarmac SL8
    - Aethos 2
    - Turbo Levo 4
    # Jared's favorites
    - Grand Prix 5000 S TR    # Continental GP5000 S TR, however the store spells it
    - GP5000 S TR
    - GP5000 STR
    - GP 5000 STR
    - Minion DHR II
    - Minion DHRII
    - Minion DHF
    - Favero Assioma          # Favero power meter pedals
    # power meters are popular
    - power meter
    - powermeter
    - Quarq
  # wanted_terms: product lines people talk about and buy. The main lists and
