  max_discount: 0.80          # above this the "list price" is usually not real
  min_price: 20               # skip anything cheaper than this
  per_category: 25            # cards shown per category (5 rows of 5 on desktop)
  per_category_page: 120      # deals on each category's own page (/bike-deals/wheels/ ...)
  per_store_per_category: 8   # cap per store inside one category
  top_count: 12               # cards in the "Best" tab
  max_pages: 100              # 100 pages x 250 = 25,000 products per store

  # --- Which brands get listed ---
  # A deal is shown only if its brand is (1) written about in the site's own
  # articles at least brand_min_mentions times, or (2) in brands_allow below.
  # brands_block always wins. The run log prints "Brands kept" and
  # "Brands skipped" so you can see what the filter did.
  site_brands_only: true
  brand_min_mentions: 2
  brands_block: [Vaast, Superior, Forestal, Mercury, Token]
  brands_boost: [OneUp]       # favorite brands: ranked higher. Add more here.
  max_age_years: 2            # skip anything whose model year is more than 2 years old
  brands_allow:
