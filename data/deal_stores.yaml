# Bike deal finder — store list
# -----------------------------
# The daily GitHub Action (scripts/deal_finder.py) scans every enabled store
# below and writes data/deals.json + data/deal_history.json, which the
# /bike-deals/ page renders.
#
# Every store here must be a Shopify shop: the script reads the public
# <base>/products.json catalog. To test whether a store works, open
# <base>/products.json in a browser — if you see JSON, it will scan.
#
# Fields
#   id          unique slug
#   name        display name on the page
#   base        store root URL, no trailing slash
#   enabled     false to skip without deleting the entry
#   collections optional list of collection handles to scan instead of the
#               whole catalog (the part after /collections/ in the URL,
#               e.g. ["sale", "clearance"]). Much faster on big stores.
#   used        true if the store sells mostly used gear. The whole store is
#               skipped: this page lists new gear only. Used, demo and
#               pre-owned items at other stores are filtered out by title.
#   max_pages   optional override of settings.max_pages (250 products/page)
#   affiliate   optional link template once the store approves you.
#               {url} = product URL, {url_encoded} = URL-encoded product URL.
#               AvantLink example:
#               "https://www.avantlink.com/click.php?tt=cl&merchant_id=MERCHANT&website_id=WEBSITE&url={url_encoded}"
#               Leave empty for a plain (non-affiliate) link.

settings:
  # "Best today" (the page's default view): a short row of top deals from each
  # of these categories, in this order. Keys: bikes, framesets, wheels,
  # drivetrain, brakes, suspension, cockpit, tires, electronics, apparel,
  # tools, accessories.
  front_sections: [bikes, wheels, drivetrain, suspension, tires]
  front_per_section: 4
  min_discount: 0.20          # at least 20% under the store's list price
  max_discount: 0.80          # above this the "list price" is usually not real
  min_price: 20               # skip anything cheaper than this
  per_category: 24            # cards shown per category
  per_store_per_category: 8   # cap per store inside one category
  top_count: 12               # cards in the "Best" tab
  max_pages: 100              # 100 pages x 250 = 25,000 products per store

  # --- Which brands get listed ---
  # A deal is shown only if its brand is (1) written about in the site's own
  # articles at least brand_min_mentions times, or (2) in brands_allow below.
  # brands_block always wins. The run log prints "Brands kept" and
  # "Brands skipped" so you can see what the filter did.
  site_brands_only: true
  brand_min_mentions: 2
  brands_block: [Vaast, Superior, Forestal, Mercury, Token]
  brands_boost: [OneUp]       # favorite brands: ranked higher. Add more here.
  max_age_years: 2            # skip anything whose model year is more than 2 years old
  brands_allow:
    # bikes and frames
    - Trek
    - Giant
    - Cannondale
    - Canyon
    - Santa Cruz
    - Yeti
    - Ibis
    - Pivot
    - Orbea
    - Cervelo
    - Colnago
    - Pinarello
    - Bianchi
    - BMC
    - Scott
    - Ventum
    # drivetrain, brakes, suspension, cockpit
    - Shimano
    - SRAM
    - Campagnolo
    - Fox
    - Fox Racing Shox
    - RockShox
    - Marzocchi
    - Ohlins
    - Cane Creek
    - Race Face
    - Easton
    - FSA
    - Thomson
    - Renthal
    - Crankbrothers
    - Magura
    - Hope
    - TRP
    - Chris King
    - Wolf Tooth
    - OneUp
    - Garbaruk
    - Fizik
    - Selle Italia
    - Ergon
    # wheels and tires
    - ENVE
    - Zipp
    - Roval
    - Bontrager
    - DT Swiss
    - Industry Nine
    - Mavic
    - Reserve
    - Hunt
    - Maxxis
    - Continental
    - Schwalbe
    - Vittoria
    - Pirelli
    - Michelin
    - Panaracer
    - WTB
    - Kenda
    # electronics, tools, gear
    - Garmin
    - Wahoo
    - Hammerhead
    - Quarq
    - Favero
    - Lezyne
    - Park Tool
    - Silca
    - Topeak
    - Muc-Off
    - Giro
    - POC
    - Kask
    - Smith
    - Pearl Izumi
    - Troy Lee Designs
    - CamelBak
    - Thule

  # Amazon buttons are off: they were search links, not the deal itself.
  # Only set a tag here if a store in this list is Amazon (needs Amazon's product API).
  amazon_tag: ""
  amazon_skip: [bikes, framesets]  # no Amazon button here: Amazon doesn't sell these brands' bikes

stores:
  # ---------------- Bike shops (all confirmed working on the first run) ----------------
  - id: worldwide-cyclery
    name: Worldwide Cyclery
    base: "https://worldwidecyclery.com"
    enabled: true
    affiliate: ""

  - id: incycle
    name: inCycle
    base: "https://www.incycle.com"
    enabled: true
    affiliate: ""

  - id: the-lost-co
    name: The Lost Co
    base: "https://www.thelostco.com"
    enabled: true
    affiliate: ""

  - id: fanatik
    name: Fanatik Bike Co
    base: "https://www.fanatikbike.com"
    enabled: true
    affiliate: ""

  - id: planet-cyclery
    name: Planet Cyclery
    base: "https://www.planetcyclery.com"
    enabled: true
    affiliate: ""

  - id: bikes-online
    name: Bikes Online
    base: "https://www.bikesonline.com"
    enabled: true
    affiliate: ""

  - id: contender
    name: Contender Bicycles
    base: "https://contenderbicycles.com"
    enabled: true
    affiliate: ""

  # ---------------- Specialized (not Shopify) ----------------
  # Reads the product list embedded in specialized.com's sale listing page.
  # `listing` is the sale page to read; change it when the sale changes
  # (e.g. /us/en/shop/sale after Black Friday). If the page is gone, the
  # store is skipped for that day and yesterday's Specialized deals stay up.
  - id: specialized
    name: Specialized
    type: specialized
    base: "https://www.specialized.com"
    listing: "/us/en/shop/black-friday"
    enabled: true
    affiliate: ""

  # ---------------- Brand-direct stores ----------------
  # Brands that sell through a Shopify store. Entries with enabled: false did
  # not respond on the first scan (their sites don't expose a readable catalog).
  # Specialized, Trek, Giant, Cannondale and Canyon aren't here for the same reason.

  # Bikes and frames
