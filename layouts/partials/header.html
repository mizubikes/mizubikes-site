{{- /* Custom Mizubikes header */ -}}
<header class="header">
    <nav class="nav">
        <div class="logo">
            <a href="{{ "" | absLangURL }}" accesskey="h" title="Mizubikes" aria-label="Mizubikes home" style="text-decoration: none; display: inline-flex; align-items: center; gap: 10px;">
                <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink: 0;"><rect width="64" height="64" rx="16" fill="#1B8FAB"/><path d="M12 26 q10 -10 20 0 t20 0" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><path d="M12 41 q10 -10 20 0 t20 0" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/></svg>
                <span style="font-family: 'Sora', system-ui, sans-serif; font-size: 30px; line-height: 1; letter-spacing: -1px;"><span style="font-weight: 800; color: var(--primary);">mizu</span><span style="font-weight: 400; color: #1B8FAB;">bikes</span></span>
            </a>
        </div>
        <ul id="menu">
            {{- range .Site.Menus.main }}
            <li>
                <a href="{{ .URL | absURL }}"
                   title="{{ .Title }}"
                   {{- if $.IsMenuCurrent "main" . }} aria-current="page"{{- end }}>
                    {{- .Name -}}
                </a>
            </li>
            {{- end }}
            <li>
                <a href="/search/" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </a>
            </li>
        </ul>
    </nav>
</header>
