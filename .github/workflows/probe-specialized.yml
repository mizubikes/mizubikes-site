name: Probe Specialized (temporary)
on:
  push:
    branches: [specialized-store]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Raw request check
        run: |
          curl -s -o page.html -w "HTTP %{http_code}  %{size_download} bytes\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36 MizubikesPriceBot/1.0" https://www.specialized.com/us/en/shop/black-friday
          grep -c "__next_f" page.html || true
          grep -o "totalResults[^,]*" page.html | head -2 || true
      - name: Dry run, Specialized only
        run: python scripts/deal_finder.py --dry-run --only specialized
