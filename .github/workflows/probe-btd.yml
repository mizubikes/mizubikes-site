name: Probe BTD
on:
  push:
    branches: [probe-btd]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36 MizubikesPriceBot/1.0"
          curl -sSL -A "$UA" -o list.html "https://www.biketiresdirect.com/search?sale=CSTLBF26"
          echo "--- product links in listing:"; grep -o 'href="[^"]*/product/[^"]*"' list.html | sort -u | head -20; grep -c '/product/' list.html
          echo "--- inline scripts mentioning search/ajax:"
          python3 - <<'PY'
          import re
          h=open('list.html',errors='ignore').read()
          for m in re.finditer(r'<script(?![^>]*src)[^>]*>(.*?)</script>',h,re.S):
              t=m.group(1)
              if re.search(r'ajax|\.aspx|\.ashx|/api|search|sale=|\.php|getJSON|\$\.post|\$\.get',t,re.I): print('SCRIPT:',t[:2500].replace('\n',' ')); print()
          i=h.find('ts_search'); print('TS:',h[i-300:i+2500].replace('\n',' ') if i>0 else 'none')
          PY
          curl -sSL -A "$UA" -o site.js "https://static.biketiresdirect.com/js/BTD-site-min510.js?v=20261024153534"
          echo "--- endpoints in site js:"; grep -oE '["'"'"'][^"'"'"' ]*(\.aspx|\.ashx|\.php|/api/|/ajax|search[A-Za-z]*\.)[^"'"'"' ]*["'"'"']' site.js | sort -u | head -40
          grep -oE '.{150}(url:|\$\.ajax|\$\.get|\$\.post|getJSON).{250}' site.js | grep -i search | head -8
