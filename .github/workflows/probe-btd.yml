name: Probe BTD
on:
  push:
    branches: [probe-btd]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          pip install requests >/dev/null
          python3 - <<'PY'
          import re, requests, json, time
          S=requests.Session(); S.headers['User-Agent']="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36 MizubikesPriceBot/1.0"
          B="https://www.biketiresdirect.com"
          h=S.get(B+"/search?sale=CSTLBF26").text
          for k in ['filtered_results','searchParams']:
              m=re.search(r'<[^>]*id=["\']%s["\'][^>]*>'%k,h); print(k, m.group(0) if m else None)
          sn=re.search(r'data-sn=["\']([^"\']*)',h); bstk=re.search(r'data-bstk=["\']([^"\']*)',h); fc=re.search(r'data-fcache=["\']([^"\']*)',h); clr=re.search(r'data-clrfc=["\']([^"\']*)',h)
          g=lambda m: m.group(1) if m else ''
          u=f"{B}/json/searchfilters?sn={g(sn)}&bstk={g(bstk)}&fcache={g(fc)}&clrfc={g(clr)}"
          print('URL',u); time.sleep(3)
          r=S.get(u); print(r.status_code, r.headers.get('content-type')); t=r.text; print(t[:3000])
          try:
              j=r.json(); print('KEYS', list(j.keys()))
              for k,v in j.items():
                  if isinstance(v,list): print(k,len(v), json.dumps(v[:3])[:800])
                  else: print(k, str(v)[:300])
          except Exception as e: print('notjson',e)
          mp=j['svtFilters']['mpc'][:4]
          time.sleep(3)
          r2=S.get(f"{B}/ajax/searchprod?mpc="+" ".join(mp)+"&bstk="+g(bstk)); print('SEARCHPROD',r2.status_code); print(r2.text[:6000])
          time.sleep(3)
          h2=S.get(B+"/search?sale=1120SCH26").text
          i=h2.find("ts_search_results"); print("SCH LIST HTML:", h2[i:i+5000])
          for q in ['/search?sale=1120SCH26','/search?sale=CSTLBF26&pg=2','/black-friday-deals']:
              hh=S.get(B+q).text; print(q, 'sn=',g(re.search(r'data-sn=["\']([^"\']*)',hh)), 'len',len(hh)); time.sleep(3)
          PY
