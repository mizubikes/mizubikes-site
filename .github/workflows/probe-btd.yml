name: Probe BTD
on:
  push:
    branches: [probe-btd]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36 MizubikesPriceBot/1.0"
          for u in "https://www.biketiresdirect.com/product/schwalbe-thunder-burt-super-race-29-inch-mtb-tire" "https://www.biketiresdirect.com/search?sale=1120SCH26" "https://www.biketiresdirect.com/robots.txt" "https://www.biketiresdirect.com/sitemap.xml" "https://www.biketiresdirect.com/products.json"; do
            echo "=================== $u"
            curl -sSL -A "$UA" -o page.html -w "HTTP %{http_code} %{size_download} bytes %{content_type}\n" "$u" || true
            echo "--- scripts/apis"
            grep -oiE '(src|href)="[^"]*(\.js|api|search|json|graphql)[^"]*"' page.html | sort -u | head -40
            echo "--- ld+json"
            grep -o 'application/ld+json' page.html | head -3
            python3 - <<'PY'
          import re
          h=open('page.html',errors='ignore').read()
          for m in re.finditer(r'<script[^>]*ld\+json[^>]*>(.*?)</script>',h,re.S): print(m.group(1)[:1500])
          for k in ['76.50','102.00','price','Price','sale_price','msrp','MSRP','__NEXT_DATA__','window.__','dataLayer','productId','sku']:
              i=h.find(k)
              if i>=0: print('['+k+']', h[max(0,i-200):i+300].replace('\n',' '))
          print('LEN',len(h)); print(h[:1500] if 'xml' in h[:200] or 'Sitemap' in h or 'User-agent' in h else '')
          PY
          done
