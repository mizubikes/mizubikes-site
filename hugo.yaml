baseURL: https://mizubikes.com
languageCode: en-US
title: Mizubikes
theme: PaperMod
services:
  googleAnalytics:
    id: G-6C4532LJC9
taxonomies:
  category: categories
  tag: tags
enableRobotsTXT: true
cascade:
  - target:
      path: "{/tags,/tags/**}"
    robotsNoIndex: true
    sitemap:
      disable: true
params:
  description: "Honest road, gravel, mountain and e-bike reviews, builds and repair guides from an engineer who wrenches on his own bikes."
  defaultTheme: light
  disableThemeToggle: true
  showShareButtons: false
  showReadingTime: true
  showToc: false
  showBreadCrumbs: true
  showCodeCopyButtons: false
  comments: false
  hideFoter: false
  cover:
    responsiveImages: false
    hiddenInList: false
    hiddenInSingle: false
  assets:
    favicon: /favicon.ico
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png
    safari_pinned_tab: /favicon.svg
    disableHLJS: true
  footer:
    text: 'As an Amazon Associate I earn from qualifying purchases. [About](/about/) · [Contact](/contact/) · [Privacy Policy](/privacy-policy/)'
markup:
  goldmark:
    renderer:
      unsafe: true
outputs:
  home:
    - HTML
    - RSS
    - JSON
outputFormats:
  RSS:
    mediaType: application/rss+xml
    baseName: feed
menu:
  main:
    - identifier: menu-road
      name: Road
      url: /categories/road/
      weight: 1
    - identifier: menu-mountain
      name: Mountain
      url: /categories/mountain/
      weight: 2
    - identifier: menu-gravel
      name: Gravel
      url: /categories/gravel/
      weight: 3
    - identifier: menu-ebike
      name: E-Bike
      url: /categories/e-bike/
      weight: 4
    - identifier: menu-bike-repair
      name: Bike Repair
      url: /categories/bike-repair/
      weight: 5
    - identifier: menu-bike-builds
      name: Bike Builds
      url: /categories/bike-builds/
      weight: 6
    - identifier: menu-guides
      name: Guides
      url: /categories/guides/
      weight: 7
    - identifier: menu-deals
      name: Deals
      url: /categories/deals/
      weight: 8
    - identifier: menu-tire-prices
      name: Tire Prices
      url: /gravel-tire-prices/
      weight: 9
